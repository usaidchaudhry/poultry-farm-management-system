services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      FRONTEND_ORIGIN: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      TRUST_PROXY: 1
      UPLOAD_DIR: /app/private/uploads
      SPA_DIR: /app/dist
      SERVE_SPA: "true"
    volumes:
      - uploads:/app/private/uploads
      - backups:/app/private/backups
    networks: [private]
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [private]
volumes:
  uploads:
  backups:
  caddy_data:
  caddy_config:
networks:
  private:
